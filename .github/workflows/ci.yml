name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gates, build, live tests and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Keep this tag equal to docker-compose.local.yml's (scripts/postgres-image.test.ts checks).
        image: postgres:18.7
        env:
          POSTGRES_USER: s10n_base
          POSTGRES_PASSWORD: s10n_base
          POSTGRES_DB: s10n_base
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=s10n_base --dbname=s10n_base"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The same values as .env.example, which the compose file also uses.
      DATABASE_URL: postgres://s10n_base:s10n_base@127.0.0.1:54320/s10n_base
      TEST_DATABASE_URL: postgres://s10n_base:s10n_base@127.0.0.1:54320/s10n_base_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Every gate that needs no database and no browser, the same command as locally: lint with
      # no suppressions, format, typecheck, boundaries, dead code, 100% coverage and the audit.
      # scripts/ci-workflow.test.ts fails if this job stops running it.
      - name: Run every gate that needs no database (bun run agent:check)
        run: bun run agent:check
      - run: bun run build
      # Against the installed Expo SDK's own version map, so the result depends only on the
      # lockfile. Online, the check compares with Expo's newest patches, which the 3-day rule may
      # not allow yet; the daily dependency update reports that drift instead.
      - name: Check the Expo-managed packages match the installed SDK
        working-directory: apps/mobile
        run: EXPO_OFFLINE=1 bunx expo install --check
      - name: Create the test database
        run: docker exec -i ${{ job.services.postgres.id }} psql --username=s10n_base --dbname=s10n_base --set=ON_ERROR_STOP=1 < docker/postgres/init/01-create-test-database.sql
      - run: bun run db:migrate
      - run: bun run db:generate:check
      - run: bun run test:live
      - name: Start the built server, check /health and /ready, and stop it with SIGTERM
        run: bun run smoke

  mobile:
    name: Bundle and prebuild the mobile app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Metro bundles both platforms from a clean install with bun's default linker, then the
      # bundle check reads the source maps: one React, the workspace from source, no test code.
      - name: Export the iOS and Android bundles and check them
        run: bun run mobile:export
      # The native projects generated from the config. pod install and Gradle need macOS and the
      # Android SDK; this checks the config plugins and the generated identifiers only.
      - name: Generate the native projects
        working-directory: apps/mobile
        run: bunx expo prebuild --no-install --platform all
      - name: Check the generated projects carry the development variant's identity
        run: bun scripts/mobile-bundle/check-prebuild.main.ts apps/mobile development

  journeys:
    name: Browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Chromium and the libraries it needs
        run: bunx playwright install --with-deps chromium
      # Builds, then Playwright starts the compose database, the email capture server and the
      # built server itself (playwright.config.ts), as it does locally. Failures are reported as
      # text only: no trace, video or screenshot is recorded or uploaded, since email links carry
      # tokens.
      - name: Sign up, confirm, sign in and out, and use a passkey, in Chromium
        run: bun run test:e2e

  container:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Keep this tag equal to docker-compose.local.yml's (scripts/postgres-image.test.ts checks).
        image: postgres:18.7
        env:
          POSTGRES_USER: s10n_base
          POSTGRES_PASSWORD: s10n_base
          POSTGRES_DB: s10n_base
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=s10n_base --dbname=s10n_base"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The admin role docker:smoke creates its throwaway database and two roles with.
      DATABASE_URL: postgres://s10n_base:s10n_base@127.0.0.1:54320/s10n_base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The same build as `bun run docker:build`, with its layers cached in the workflow's own
      # cache, so no registry or account is involved. The image is loaded locally, never pushed.
      - name: Build the image from docker/Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: APP_VERSION=${{ github.sha }}
          tags: s10n-base:local
          load: true
          push: false
          cache-from: type=gha,scope=container-image
          cache-to: type=gha,mode=max,scope=container-image
      # Checks the image's settings and files, migrates a throwaway database from the image as
      # the owner role granting the app role, refuses a bad config, runs the server as the app
      # role in production mode with a read-only root filesystem, checks it, and stops it with
      # SIGTERM. scripts/container/smoke.ts lists every check.
      - name: Run the image in production mode and check it (bun run docker:smoke)
        run: bun run docker:smoke
      - name: Print the image size
        run: docker image ls s10n-base:local --format "{{.Repository}}:{{.Tag}} {{.Size}}"
