# Opens one PR a day with every dependency, bun and Node update the 3-day rule allows.
# The logic lives in scripts/dependency-updates; docs/dependencies.md explains the setup.
name: Dependency updates

on:
  schedule:
    # GitHub may start scheduled runs late at busy times such as midnight UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  update:
    name: Open or update the dependency-update PR
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      # A project made from this template, or a fork, has no app yet: end with a notice
      # instead of failing every night.
      - name: Check that the GitHub App is configured
        id: config
        env:
          HAS_CLIENT_ID: ${{ secrets.DEPS_UPDATE_APP_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.DEPS_UPDATE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_CLIENT_ID" = "true" ] && [ "$HAS_PRIVATE_KEY" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Dependency updates are not configured::Add the DEPS_UPDATE_APP_CLIENT_ID and DEPS_UPDATE_APP_PRIVATE_KEY secrets (docs/dependencies.md). Nothing was updated."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # The app token does the writing. A PR opened with GITHUB_TOKEN would not trigger CI.
      - name: Create a GitHub App token
        id: app-token
        if: steps.config.outputs.configured == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEPS_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_UPDATE_APP_PRIVATE_KEY }}

      - name: Check out with the app token
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Full history, to merge main into the open update branch.
          fetch-depth: 0
          # Kept so the script can push the update branch; the token expires after the job.
          persist-credentials: true

      - name: Set up Node
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up bun
        if: steps.config.outputs.configured == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Commit as the app's bot user
        id: identity
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Update dependencies and open or update the PR
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPS_UPDATE_GIT_NAME: ${{ steps.identity.outputs.name }}
          DEPS_UPDATE_GIT_EMAIL: ${{ steps.identity.outputs.email }}
        run: bun run deps:update
